[Service]
ExecStop=
ExecStop=/usr/bin/podman stop --ignore --time=-1 halogen-flash-uncensored
ExecStopPost=
# Startup failure must not remove an unrelated, stopped container of the same name.
ExecStopPost=-/usr/bin/podman rm --ignore --filter label=io.evox2.halogen.service=halogen-active --filter name=^halogen-flash-uncensored$$
TimeoutStopSec=infinity
Restart=no
KillMode=mixed
SendSIGKILL=no
